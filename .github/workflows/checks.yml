name: Check Jewelry Workbench
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/workbench.test.cjs
      - run: node --check dist/workbench.js && node --check dist/core.js && node --check dist/tools/bridge.js
